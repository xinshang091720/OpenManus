# Global LLM configuration
[llm]
# model = ""       # The LLM model to use
# base_url = "https://api.anthropic.com/v1/" # API endpoint URL
# api_key = "BEESYNC_HOST_MUST_INJECT_API_KEY" # C# injects BEESYNC_LLM_API_KEY at process start
# max_tokens = 8192                          # Maximum number of tokens in the response
# temperature = 0.2
model = "qwen3.7-max"
base_url = "https://llm-o68gg8ysacbgd9cv.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
api_key = "BEESYNC_HOST_MUST_INJECT_API_KEY"
max_tokens = 8192
temperature = 0.2                     # Stable tool planning; set 0.0 for fully deterministic output

# Optional dedicated model policy for browser page extraction. Qwen hybrid
# thinking models must disable thinking when BrowserUseTool forces a structured
# extraction tool call.
# [llm.browser]
# enable_thinking = false
# temperature = 0.0

# Optional lightweight model for classifying ambiguous DWG text as a room name.
# If omitted, it inherits [llm].model.  Runtime callers can instead set
# BEESYNC_ROOM_TEXT_MODEL.  This request always disables thinking.
# [llm.room_text_classifier]
# model = "your-non-thinking-model"
# enable_thinking = false
# temperature = 0.0
# max_tokens = 32
#
# Optional environment-only override for the read-only DWG title/floor
# fallback: BEESYNC_FLOOR_TITLE_MODEL and BEESYNC_FLOOR_TITLE_TIMEOUT_SECONDS.
# It also disables thinking and falls back to this room-text model.

